name: ESI3 public liquidation archive
on:
  push:
    branches: [research/eth-esi-3]
    paths: [.github/workflows/esi3-public-liq.yml, research/esi3/collect_public_liquidations.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    if: github.ref == 'refs/heads/research/eth-esi-3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python research/esi3/collect_public_liquidations.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/esi3/data/public_liquidation_*
          git diff --cached --quiet || (git commit -m "ESI3 public liquidation audit" && git pull --rebase origin research/eth-esi-3 && git push origin HEAD:research/eth-esi-3)
