name: ESI3 stage4 waves
on:
  push:
    branches: [research/eth-esi-3]
    paths: [research/esi3/stage4_waves.py, .github/workflows/esi3-stage4.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/research/eth-esi-3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python research/esi3/stage4_waves.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/esi3/data/stage4_wave_candidates.jsonl research/esi3/data/stage4_wave_audit.json
          git diff --cached --quiet || (git commit -m "ESI3 stage4 wave candidates" && git pull --rebase origin research/eth-esi-3 && git push origin HEAD:research/eth-esi-3)
