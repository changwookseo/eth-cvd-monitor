name: ESI3 Binance live collection

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: esi3-binance-live
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/research/eth-esi-3'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect research-only Binance data
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          ESI3_OI_CRON_JOB_ID: '8738287'
          ESI3_FUNDING_CRON_JOB_ID: '8946770'
          ESI3_FUTURES_BARS_CRON_JOB_ID: '8946772'
        run: python -m research.esi3.collect_live
      - name: Render research report from verified snapshot
        run: python -m research.esi3.render_live_report
      - name: Save verified snapshot and report on the research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/esi3/data/binance_live_latest.json research/esi3/data/binance_live_report.md
          if ! git diff --cached --quiet; then
            git commit -m "Update ESI3 Binance live snapshot"
            git pull --rebase origin research/eth-esi-3
            git push origin HEAD:research/eth-esi-3
          fi
