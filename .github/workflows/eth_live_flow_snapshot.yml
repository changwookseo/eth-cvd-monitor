name: ETH Live Flow Research Snapshot
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: feature/binance-180d-integration
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch live hourly spot futures OI funding
        run: python eth_live_condition_snapshot.py
      - name: Upload research snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-live-flow-${{ github.run_id }}
          path: research_live/
          retention-days: 30
          if-no-files-found: warn
