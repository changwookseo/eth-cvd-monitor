name: ESI3 liquidation inventory
on:
  push:
    branches: [research/eth-esi-3]
    paths: [research/esi3/probe_liquidation_archive.py, .github/workflows/esi3-liquidation-inventory.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inventory:
    if: github.ref == 'refs/heads/research/eth-esi-3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python research/esi3/probe_liquidation_archive.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/esi3/data/liquidation_archive_inventory.json
          git diff --cached --quiet || (git commit -m "ESI3 liquidation inventory result" && git push origin HEAD:research/eth-esi-3)
