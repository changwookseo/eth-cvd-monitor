name: ETH 180D Elliott Structure Comparison
on:
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: feature/binance-180d-integration
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect hourly spot and futures data
        run: python eth_180d_collect.py
      - name: Collect OI and funding archives
        run: python eth_180d_derivatives.py
      - name: Integrate observations
        run: python eth_180d_integrate.py
      - name: Compare baseline and confirmed swing structure
        run: python eth_180d_wave_comparison.py
      - name: Upload paired comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-wave-comparison-${{ github.run_id }}
          path: research_wave_comparison/
          retention-days: 90
          if-no-files-found: warn
