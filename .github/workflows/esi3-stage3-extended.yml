name: ESI3 stage3 extended
on:
  push:
    branches: [research/eth-esi-3]
    paths: [research/esi3/stage3_extended.py, .github/workflows/esi3-stage3-extended.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/research/eth-esi-3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python research/esi3/stage3_extended.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/esi3/data/stage3_extended_daily.csv research/esi3/data/stage3_extended_audit.json
          git diff --cached --quiet || (git commit -m "ESI3 extended stage3 results" && git pull --rebase origin research/eth-esi-3 && git push origin HEAD:research/eth-esi-3)
