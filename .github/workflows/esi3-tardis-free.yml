name: ESI3 Tardis free archive
on:
  push:
    branches: [research/eth-esi-3]
    paths: [research/esi3/collect_tardis_free.py, .github/workflows/esi3-tardis-free.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    if: github.ref == 'refs/heads/research/eth-esi-3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python research/esi3/collect_tardis_free.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/esi3/data/tardis_free_liquidation_{manifest.json,daily.csv}
          git diff --cached --quiet || (git commit -m "ESI3 monthly liquidation sample results" && git push origin HEAD:research/eth-esi-3)
