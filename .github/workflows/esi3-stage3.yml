name: ESI3 stage 3 baseline
on:
  push:
    branches: [research/eth-esi-3]
    paths: [research/esi3/stage3_features.py, .github/workflows/esi3-stage3.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  baseline:
    if: github.ref == 'refs/heads/research/eth-esi-3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python research/esi3/stage3_features.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/esi3/data/stage3_features_daily.csv research/esi3/data/stage3_feature_audit.json
          git diff --cached --quiet || (git commit -m "ESI3 stage 3 baseline audit" && git pull --rebase origin research/eth-esi-3 && git push origin HEAD:research/eth-esi-3)
