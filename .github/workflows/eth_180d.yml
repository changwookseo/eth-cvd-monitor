name: ETH 180D Backfill

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect historical ETH data
        run: python eth_180d_collect.py

      - name: Upload research data
        uses: actions/upload-artifact@v4
        with:
          name: eth-180d-data
          path: research_data/
          retention-days: 30
