name: ESI3 stage5 pairs
on:
  push:
    branches: [research/eth-esi-3]
    paths: [research/esi3/stage5_pairs.py, .github/workflows/esi3-stage5.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/research/eth-esi-3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python research/esi3/stage5_pairs.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/esi3/data/stage5_wave_pairs.jsonl research/esi3/data/stage5_pair_audit.json
          git diff --cached --quiet || (git commit -m "ESI3 stage5 paired results" && git pull --rebase origin research/eth-esi-3 && git push origin HEAD:research/eth-esi-3)
