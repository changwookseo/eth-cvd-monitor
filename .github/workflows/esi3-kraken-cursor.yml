name: ESI3 Kraken cursor verification
on:
  push:
    branches: [research/eth-esi-3]
    paths: [research/esi3/verify_kraken_cursor.py, .github/workflows/esi3-kraken-cursor.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.ref == 'refs/heads/research/eth-esi-3'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python research/esi3/verify_kraken_cursor.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/esi3/data/kraken_cursor_audit.json
          git diff --cached --quiet || (git commit -m "ESI3 Kraken cursor audit" && git push origin HEAD:research/eth-esi-3)
