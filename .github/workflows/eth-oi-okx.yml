name: ETH OKX Live OI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - eth_oi_okx_live.py
      - .github/workflows/eth-oi-okx.yml
  schedule:
    - cron: '2-59/5 * * * *'
  # Fallback: existing external Cron dispatches Binance Spot CVD every 5 minutes.
  # This only triggers the independent OKX collector; it does not read Binance OI.
  workflow_run:
    workflows: ["Binance Spot CVD"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: eth-oi-okx-main
  cancel-in-progress: false

jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch and validate OKX ETH swap OI
        run: python eth_oi_okx_live.py
      - name: Validate output contract and freshness
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          with open('eth_oi_okx_latest.json', encoding='utf-8') as f:
              x = json.load(f)
          assert x['status'] == 'VERIFIED'
          assert x['exchange'] == 'OKX' and x['symbol'] == 'ETH-USDT-SWAP'
          assert x['unit'] == 'ETH' and x['value'] > 0 and x['oi_usd'] > 0
          t = datetime.fromisoformat(x['observed_at_utc'])
          age = (datetime.now(timezone.utc) - t).total_seconds()
          assert -30 <= age <= 300, f'Stale OI: {age:.1f}s'
          print('PASS: OKX OI verified; this is not Binance or total-market OI')
          PY
      - name: Commit verified OKX OI snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Keep the validated API result outside the checkout while main advances.
          cp eth_oi_okx_latest.json "$RUNNER_TEMP/eth_oi_okx_candidate.json"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            # Reset only this disposable Actions checkout; never reset the remote branch.
            git reset --hard origin/main
            # Do not overwrite a newer OI snapshot, and do not let rebase silently
            # discard a valid newer candidate when two collectors update the same file.
            if python - "$RUNNER_TEMP/eth_oi_okx_candidate.json" eth_oi_okx_latest.json <<'PY'
          import json
          import sys
          from datetime import datetime
          from pathlib import Path
          candidate = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          previous_path = Path(sys.argv[2])
          previous = json.loads(previous_path.read_text(encoding="utf-8")) if previous_path.exists() else None
          assert candidate["status"] == "VERIFIED"
          assert candidate["exchange"] == "OKX" and candidate["symbol"] == "ETH-USDT-SWAP"
          if previous is not None:
              assert previous["exchange"] == "OKX" and previous["symbol"] == "ETH-USDT-SWAP"
              if datetime.fromisoformat(previous["observed_at_utc"]) >= datetime.fromisoformat(candidate["observed_at_utc"]):
                  print("SKIP: main already has an equal or newer verified OKX OI observation")
                  sys.exit(0)
          sys.exit(1)
          PY
            then
              exit 0
            fi
            cp "$RUNNER_TEMP/eth_oi_okx_candidate.json" eth_oi_okx_latest.json
            git add eth_oi_okx_latest.json
            git commit -m "Update verified OKX ETH OI"
            if git push origin HEAD:main; then
              echo "STORED: verified OKX OI observation committed to main"
              exit 0
            fi
            echo "Main advanced during OI push; retry ${attempt}/8"
            sleep $((attempt * 2))
          done
          echo "Could not store verified OKX OI after retries" >&2
          exit 1
