name: ESI3 futures CVD history
on:
  push:
    branches: [research/eth-esi-3]
    paths:
      - research/esi3/collect_futures_cvd.py
      - .github/workflows/esi3-futures-cvd.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: esi3-futures-cvd
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/research/eth-esi-3'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/esi3/collect_futures_cvd.py
      - name: Save only futures research outputs
        if: always()
        run: |
          if [ -f research/esi3/data/futures_cvd_manifest.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/esi3/data/futures_cvd_manifest.json research/esi3/data/binance_futures_daily.csv
            if ! git diff --cached --quiet; then
              git commit -m "ESI3 futures CVD data and audit"
              git push origin HEAD:research/eth-esi-3
            fi
          fi
