name: ESI3 historical research acquisition
on:
  push:
    branches: [research/eth-esi-3]
    paths:
      - research/esi3/collect_daily.py
      - .github/workflows/esi3-history.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    if: github.ref == 'refs/heads/research/eth-esi-3'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect and validate
        id: collect
        run: python research/esi3/collect_daily.py
      - name: Save audit and data to research branch
        if: always()
        run: |
          if [ -f research/esi3/data/manifest.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/esi3/data/
            if ! git diff --cached --quiet; then
              git commit -m "ESI3 historical data and coverage audit"
              git push origin HEAD:research/eth-esi-3
            fi
          fi
