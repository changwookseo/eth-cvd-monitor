name: ETH 180D Exploratory Backtest
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/binance-180d-integration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect spot and futures flow
        run: python eth_180d_collect.py
      - name: Collect OI and funding
        run: python eth_180d_derivatives.py
      - name: Integrate historical data
        run: python eth_180d_integrate.py
      - name: Run timestamp-safe exploratory event study
        run: python eth_180d_backtest.py
      - name: Upload immutable run reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-180d-backtest-${{ github.run_id }}
          path: |
            research_backtests/
            research_integrated/integration_status.json
            research_derivatives/derivatives_status.json
            research_data/collection_status.json
          retention-days: 90
