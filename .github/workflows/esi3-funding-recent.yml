name: ESI3 recent funding
on:
  push:
    branches: [research/eth-esi-3]
    paths: [research/esi3/collect_funding_recent.py, .github/workflows/esi3-funding-recent.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    if: github.ref == 'refs/heads/research/eth-esi-3'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python research/esi3/collect_funding_recent.py
      - if: always()
        run: |
          if [ -f research/esi3/data/funding_recent_manifest.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research/esi3/data/funding_recent_manifest.json research/esi3/data/binance_funding_recent_events.csv
            if ! git diff --cached --quiet; then
              git commit -m "ESI3 recent funding validation"
              git push origin HEAD:research/eth-esi-3
            fi
          fi
